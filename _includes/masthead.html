<header class="masthead">
  <div class="shell masthead__inner">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav aria-label="Main">
      <button class="nav__toggle" type="button"
              aria-expanded="false" aria-controls="nav-list" aria-label="Menu">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>

      <ul class="nav__list" id="nav-list">
        {%- for link in site.data.navigation.main %}
        <li>
          <a class="nav__link"
             href="{{ link.url | relative_url }}"
             {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>
        </li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
