# ==============================================================================
# Site settings
# ==============================================================================

title           : "Pooya Farshim"
title_separator : "·"
description     : "Research Fellow at Input Output and Honorary Fellow at Durham University, working on the foundations of cryptography and blockchain protocols."
url             : https://farshim.github.io
baseurl         : ""
repository      : "farshim/farshim.github.io"
locale          : "en-US"
timezone        : Europe/Paris


# ==============================================================================
# Author — consumed by _includes/profile.html and the JSON-LD block in head.html
# ==============================================================================

author:
  name          : "Pooya Farshim"
  bio           : "Research Fellow"
  employer      : "Input Output"
  location      :
  avatar        : "profile.jpg"
  email         : "pooya.farshim@gmail.com"
  googlescholar : "https://scholar.google.com/citations?user=w_Pjc6MAAAAJ&hl=en"
  DBLP          : "https://dblp.org/pid/64/5418.html"
  linkedin      : "farshim"


# ==============================================================================
# Build
# ==============================================================================

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache

encoding     : "utf-8"
markdown     : kramdown
highlighter  : rouge
permalink    : /:title/

kramdown:
  input           : GFM
  hard_wrap       : false
  auto_ids        : true
  smart_quotes    : lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge

sass:
  sass_dir  : _sass
  style     : compressed
  sourcemap : never   # otherwise a 36KB .map ships alongside an 12KB stylesheet


# ==============================================================================
# Defaults
#
# There are no collections: every page is hand-written in _pages. The theme's
# _publications / _talks / _teaching / _portfolio collections were sample data
# and have been removed, along with the misspelled `publicatiions:` key that
# meant _publications was never registered as a collection in the first place.
# ==============================================================================

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout         : page
      author_profile : true


# ==============================================================================
# Plugins (all supported by GitHub Pages)
# ==============================================================================

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
