<!doctype html>
<html lang="{{ site.locale | default: 'en' | slice: 0, 2 }}">
<head>
  {%- include head.html %}
</head>
<body>
  <div class="page-wrap">
    <a class="skip-link" href="#main">Skip to content</a>

    {%- include masthead.html %}

    <main class="main" id="main">
      {{ content }}
    </main>

    {%- include footer.html %}
  </div>

  <script>
    // Mobile nav disclosure. Replaces jQuery + the "greedy nav" plugin.
    (function () {
      var toggle = document.querySelector('.nav__toggle');
      var list = document.getElementById('nav-list');
      if (!toggle || !list) return;

      function setOpen(open) {
        toggle.setAttribute('aria-expanded', String(open));
        list.setAttribute('data-open', String(open));
      }

      toggle.addEventListener('click', function () {
        setOpen(toggle.getAttribute('aria-expanded') !== 'true');
      });

      // Close on Escape, and return focus to the control that opened it.
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
          setOpen(false);
          toggle.focus();
        }
      });

      // Reset state when the viewport grows past the mobile breakpoint,
      // so the panel does not stay stuck open on rotate/resize.
      var mq = window.matchMedia('(min-width: 40rem)');
      (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(
        function (e) { if (e.matches) setOpen(false); }
      );
    })();
  </script>
</body>
</html>
